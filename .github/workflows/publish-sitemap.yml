name: Publish Oaklin Lane Sitemaps

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Generate English and Spanish sitemaps
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          WEBFLOW_SITE_ID: ${{ vars.WEBFLOW_SITE_ID }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          python3 - <<'PY'
          import os
          import json
          import xml.etree.ElementTree as ET
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode, quote

          BASE_URL = "https://www.oaklinlane.com"
          NS = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", NS)

          COLLECTIONS = [
              ("Blog Posts", "posts", "blog"),
              ("Locations", "locations", "locations"),
              ("Blog Topics", "categories", "topic"),
              ("Blog Authors", "authors", "author"),
          ]

          SERVICES = {
              "/sensory-integration",
              "/physical-occupational-therapies",
              "/speech-language-therapy",
              "/feeding-swallowing-therapy",
          }

          EXCLUDED_PAGES = {
              "/404",
              "/401",
              "/thank-you",
              "/brand/business-cards",
              "/resources-2",
              "/academy-lane-registration",
          }

          def webflow(path):
              request = Request(
                  "https://api.webflow.com/v2" + path,
                  headers={
                      "Authorization": "Bearer " + os.environ["WEBFLOW_API_TOKEN"],
                      "Accept": "application/json",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          def get_all(path, key, extra=None):
              offset = 0
              while True:
                  params = {"limit": 100, "offset": offset}
                  if extra:
                      params.update(extra)
                  response = webflow(path + "?" + urlencode(params))
                  items = response[key]
                  yield from items
                  offset += len(items)
                  if not items or offset >= response["pagination"]["total"]:
                      break

          def write_sitemap(filename, urls):
              root = ET.Element(f"{{{NS}}}urlset")
              unique_urls = sorted(set(urls))
              for url in unique_urls:
                  entry = ET.SubElement(root, f"{{{NS}}}url")
                  ET.SubElement(entry, f"{{{NS}}}loc").text = url
              ET.indent(root, space="  ")
              ET.ElementTree(root).write(
                  f"_site/{filename}",
                  encoding="utf-8",
                  xml_declaration=True,
              )
              print(f"{filename}: {len(unique_urls)} URLs")

          site_id = os.environ["WEBFLOW_SITE_ID"]
          locales = webflow(f"/sites/{site_id}")["locales"]
          spanish = next(
              (
                  locale for locale in locales["secondary"]
                  if locale["tag"].lower().startswith("es")
                  and locale.get("enabled", True)
              ),
              None,
          )
          if not spanish:
              raise SystemExit("Enabled Spanish locale not found")

          spanish_code = spanish["subdirectory"].strip("/")
          language_configs = [
              ("", "", locales["primary"]["cmsLocaleId"], None),
              ("es-", spanish_code, spanish["cmsLocaleId"], spanish["id"]),
          ]

          collection_list = webflow(f"/sites/{site_id}/collections")["collections"]
          collection_ids = {c["displayName"]: c["id"] for c in collection_list}

          # Generate CMS sitemaps
          for name, filename_stem, route in COLLECTIONS:
              if name not in collection_ids:
                  raise SystemExit(f"CMS collection not found: {name}")
              collection_id = collection_ids[name]
              for prefix, directory, cms_locale_id, _ in language_configs:
                  urls = []
                  for item in get_all(
                      f"/collections/{collection_id}/items/live",
                      "items",
                      {"cmsLocaleId": cms_locale_id},
                  ):
                      if item.get("isDraft") or item.get("isArchived"):
                          continue
                      slug = item.get("fieldData", {}).get("slug")
                      if not slug:
                          continue
                      if name == "Blog Topics" and slug == "all-posts":
                          continue
                      segments = ([directory] if directory else []) + [
                          route, quote(slug, safe="-._~")
                      ]
                      urls.append(BASE_URL + "/" + "/".join(segments))
                  if not urls:
                      raise SystemExit(f"No published URLs found for {prefix}{filename_stem}")
                  write_sitemap(f"{prefix}{filename_stem}-sitemap.xml", urls)

          # Generate Pages and Services sitemaps
          for prefix, directory, _, page_locale_id in language_configs:
              params = {"localeId": page_locale_id} if page_locale_id else None
              pages_urls = []
              services_urls = []
              locale_prefix = "/" + directory if directory else ""

              for page in get_all(f"/sites/{site_id}/pages", "pages", params):
                  if page.get("draft") or page.get("archived"):
                      continue
                  if page.get("isBranch") or page.get("collectionId"):
                      continue
                  path = page.get("publishedPath")
                  if not path or not path.startswith("/"):
                      continue

                  if directory:
                      if path != locale_prefix and not path.startswith(locale_prefix + "/"):
                          continue
                      base_path = path[len(locale_prefix):] or "/"
                  else:
                      base_path = path

                  base_path = base_path.rstrip("/") or "/"
                  if base_path in EXCLUDED_PAGES:
                      continue

                  url = BASE_URL + path
                  if base_path in SERVICES:
                      services_urls.append(url)
                  else:
                      pages_urls.append(url)

              if not services_urls or not pages_urls:
                  raise SystemExit(f"Missing Pages or Services for locale {prefix or 'en'}")
              write_sitemap(f"{prefix}pages-sitemap.xml", pages_urls)
              write_sitemap(f"{prefix}services-sitemap.xml", services_urls)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload sitemap files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish sitemaps
        id: deployment
        uses: actions/deploy-pages@v4
