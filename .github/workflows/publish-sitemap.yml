name: Publish Blog Sitemaps

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Generate English and Spanish blog sitemaps
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          WEBFLOW_SITE_ID: ${{ vars.WEBFLOW_SITE_ID }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          python3 - <<'PY'
          import os
          import json
          import xml.etree.ElementTree as ET
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode, quote

          def webflow(path):
              request = Request(
                  "https://api.webflow.com/v2" + path,
                  headers={
                      "Authorization": "Bearer " + os.environ["WEBFLOW_API_TOKEN"],
                      "Accept": "application/json"
                  }
              )
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          site_id = os.environ["WEBFLOW_SITE_ID"]

          site = webflow(f"/sites/{site_id}")
          locales = site["locales"]

          spanish = next(
              (
                  loc for loc in locales["secondary"]
                  if loc["tag"].lower().startswith("es")
                  and loc.get("enabled", True)
              ),
              None
          )

          if not spanish:
              raise SystemExit("Enabled Spanish locale not found")

          collections = webflow(
              f"/sites/{site_id}/collections"
          )["collections"]

          blog = next(
              (
                  c for c in collections
                  if c["displayName"] == "Blog Posts"
              ),
              None
          )

          if not blog:
              raise SystemExit("Blog Posts collection not found")

          ns = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", ns)

          def generate(filename, cms_locale_id, prefix):
              root = ET.Element(f"{{{ns}}}urlset")
              urls = set()
              offset = 0

              while True:
                  query = urlencode({
                      "limit": 100,
                      "offset": offset,
                      "cmsLocaleId": cms_locale_id
                  })

                  data = webflow(
                      f"/collections/{blog['id']}/items/live?{query}"
                  )

                  items = data["items"]

                  for item in items:
                      if item.get("isDraft") or item.get("isArchived"):
                          continue

                      slug = item.get("fieldData", {}).get("slug")
                      if not slug:
                          continue

                      url = (
                          "https://www.oaklinlane.com/"
                          + prefix
                          + "blog/"
                          + quote(slug, safe="-._~")
                      )

                      if url in urls:
                          continue

                      urls.add(url)

                      entry = ET.SubElement(root, f"{{{ns}}}url")
                      ET.SubElement(entry, f"{{{ns}}}loc").text = url

                  offset += len(items)

                  if not items or offset >= data["pagination"]["total"]:
                      break

              if not urls:
                  raise SystemExit(f"No published URLs for {filename}")

              ET.indent(root, space="  ")
              ET.ElementTree(root).write(
                  f"_site/{filename}",
                  encoding="utf-8",
                  xml_declaration=True
              )

              print(f"{filename}: {len(urls)} URLs")

          generate(
              "posts-sitemap.xml",
              locales["primary"]["cmsLocaleId"],
              ""
          )

          spanish_path = spanish["subdirectory"].strip("/") + "/"

          generate(
              "es-posts-sitemap.xml",
              spanish["cmsLocaleId"],
              spanish_path
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload sitemap files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish sitemaps
        id: deployment
        uses: actions/deploy-pages@v4
