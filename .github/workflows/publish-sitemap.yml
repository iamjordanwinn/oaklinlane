name: Publish Oaklin Lane Sitemaps

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Generate English and Spanish CMS sitemaps
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          WEBFLOW_SITE_ID: ${{ vars.WEBFLOW_SITE_ID }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          python3 - <<'PY'
          import os
          import json
          import xml.etree.ElementTree as ET
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode, quote

          BASE_URL = "https://www.oaklinlane.com"
          SITEMAP_NS = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", SITEMAP_NS)

          COLLECTIONS = [
              ("Blog Posts", "posts", "blog"),
              ("Locations", "locations", "locations"),
              ("Blog Topics", "categories", "topic"),
              ("Blog Authors", "authors", "blog-authors"),
          ]

          def webflow(path):
              request = Request(
                  "https://api.webflow.com/v2" + path,
                  headers={
                      "Authorization": "Bearer " + os.environ["WEBFLOW_API_TOKEN"],
                      "Accept": "application/json"
                  }
              )
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          def live_items(collection_id, cms_locale_id):
              offset = 0
              while True:
                  query = urlencode({
                      "limit": 100,
                      "offset": offset,
                      "cmsLocaleId": cms_locale_id
                  })
                  data = webflow(
                      f"/collections/{collection_id}/items/live?{query}"
                  )
                  items = data["items"]
                  for item in items:
                      yield item
                  offset += len(items)
                  if not items or offset >= data["pagination"]["total"]:
                      break

          site_id = os.environ["WEBFLOW_SITE_ID"]
          locales = webflow(f"/sites/{site_id}")["locales"]
          spanish = next(
              (
                  locale for locale in locales["secondary"]
                  if locale["tag"].lower().startswith("es")
                  and locale.get("enabled", True)
              ),
              None
          )
          if not spanish:
              raise SystemExit("Enabled Spanish locale not found")

          site_collections = webflow(
              f"/sites/{site_id}/collections"
          )["collections"]
          collections_by_name = {
              collection["displayName"]: collection["id"]
              for collection in site_collections
          }

          locales_to_publish = [
              ("", "", locales["primary"]["cmsLocaleId"]),
              (
                  "es-",
                  spanish["subdirectory"].strip("/"),
                  spanish["cmsLocaleId"]
              ),
          ]

          for name, filename_stem, route in COLLECTIONS:
              if name not in collections_by_name:
                  raise SystemExit(f"CMS collection not found: {name}")

              collection_id = collections_by_name[name]
              for filename_prefix, url_prefix, cms_locale_id in locales_to_publish:
                  filename = f"{filename_prefix}{filename_stem}-sitemap.xml"
                  root = ET.Element(f"{{{SITEMAP_NS}}}urlset")
                  seen = set()

                  for item in live_items(collection_id, cms_locale_id):
                      if item.get("isDraft") or item.get("isArchived"):
                          continue

                      slug = item.get("fieldData", {}).get("slug")
                      if not slug:
                          continue

                      parts = [BASE_URL]
                      if url_prefix:
                          parts.append(url_prefix)
                      parts.extend((route, quote(slug, safe="-._~")))
                      url = "/".join(parts)

                      if url in seen:
                          continue

                      seen.add(url)
                      entry = ET.SubElement(root, f"{{{SITEMAP_NS}}}url")
                      ET.SubElement(entry, f"{{{SITEMAP_NS}}}loc").text = url

                  if not seen:
                      raise SystemExit(f"No published URLs found for {filename}")

                  ET.indent(root, space="  ")
                  ET.ElementTree(root).write(
                      f"_site/{filename}",
                      encoding="utf-8",
                      xml_declaration=True
                  )
                  print(f"{filename}: {len(seen)} URLs")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload sitemap files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish sitemaps
        id: deployment
        uses: actions/deploy-pages@v4
